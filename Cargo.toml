[package]
name = "appcfg"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = { version = "6.0.0", optional = true }
notify = { version = "8.2.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

[features]
system-dirs = ["dep:dirs"]
watcher = ["dep:notify"]
